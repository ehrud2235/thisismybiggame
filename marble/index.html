<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구슬치기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%233a7be0%22/%3E%3Cpath d=%22M4 17c6-7 12 4 24-3%22 stroke=%22%23ff9b4a%22 stroke-width=%223%22 fill=%22none%22/%3E%3Ccircle cx=%2211%22 cy=%2210%22 r=%223%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="Marble board. Pull back and release to shoot."></canvas>

<div id="hud">
  <button class="gear" id="gearBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1L14.5 2.7a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.7 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4H14c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
  <div class="stage" id="stageNo">STAGE 1</div>
  <div class="ammo" id="ammo" role="img" aria-label="Marbles left"></div>
</div>

<div id="settings" hidden>
  <div class="row"><span>Sound</span><button class="toggle" id="soundBtn" type="button" aria-pressed="true">On</button></div>
  <button class="btn" id="retryBtn" type="button">Restart</button>
  <details id="physics">
    <summary>Physics</summary>
    <div id="dbgStats" class="readout"></div>
    <div id="tunables"></div>
    <button class="btn" id="resetTune" type="button">Reset physics</button>
  </details>
</div>

<p id="hint"></p>

<div id="result" hidden>
  <div class="card" role="dialog" aria-labelledby="resTitle">
    <p class="eyebrow" id="resStage">STAGE 1</p>
    <h2 id="resTitle">CLEAR</h2>
    <div class="stars" id="resStars"></div>
    <p class="note" id="resNote"></p>
    <button class="btn primary" id="againBtn" type="button">Retry</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
